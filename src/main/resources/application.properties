# ---- Resource limits (per single render request) ----
renderer.max-input-chars=1000000
renderer.max-depth=64
renderer.max-table-rows=1000
renderer.max-table-cols=100
renderer.max-images=100
renderer.timeout-millis=5000

# ---- Result cache ----
renderer.cache-capacity=256
renderer.cache-ttl-millis=60000

spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.max-file-size=2MB
